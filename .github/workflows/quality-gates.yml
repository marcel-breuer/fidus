name: Quality gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    # Row-level-security tests need a real PostgreSQL with pgvector. The superuser acts as the
    # owner role; the tests create the restricted application role themselves.
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: fidus
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: fidus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fidus -d fidus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_OWNER_URL: postgresql+asyncpg://fidus:ci-owner-password@localhost:5432/fidus
      DATABASE_URL: postgresql+asyncpg://fidus_app:ci-app-password@localhost:5432/fidus
      APP_DB_USER: fidus_app
      APP_DB_PASSWORD: ci-app-password
      SECRET_KEY: ci-secret-key-not-used-in-production
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install ffmpeg for the audio segmenting test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install backend dependencies
        working-directory: backend
        run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .

      - name: Run backend test suite
        working-directory: backend
        run: pytest

      - name: Check committed OpenAPI schema is current
        working-directory: backend
        run: python -m app.export_openapi | diff - ../frontend/openapi.json

  frontend:
    name: Frontend tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check generated API types are current
        working-directory: frontend
        run: npx --no-install openapi-typescript openapi.json | diff - src/lib/api/schema.d.ts

      - name: Type check
        working-directory: frontend
        run: npm run check

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
