name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fidus-release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Create release PR or publish release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require a workflow-capable release token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN_FIDUS }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_PLEASE_TOKEN" ]]; then
            echo "::error title=Missing release token::Add the RELEASE_PLEASE_TOKEN_FIDUS repository Actions secret. See docs/releases.md."
            exit 1
          fi

      - name: Create or update the release PR and publish merged releases
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN_FIDUS }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
