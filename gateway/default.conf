# Docker's embedded DNS; short validity so restarted containers are picked up.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 100m;

    include /tmp/trusted_proxies.conf;

    include /etc/nginx/security-headers.conf;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Correlation id for the structured logs; the backend echoes it in the response.
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # API and MCP carry Server-Sent Events: never buffer, keep idle streams open.
    location ~ ^/(api|mcp)(/|$) {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no always;
        include /etc/nginx/security-headers.conf;
    }

    location = /health {
        set $backend http://backend:8000;
        proxy_pass $backend;
    }

    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
    }
}
