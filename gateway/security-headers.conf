# Included in the server block and in every location that sets its own add_header: nginx does not
# inherit headers from the server level into a location that defines any add_header itself.
# Strict-Transport-Security is deliberately absent: the gateway speaks plain HTTP and the TLS
# terminator in front of it is the place to send it (see docs/runbook.md).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
add_header Cross-Origin-Opener-Policy same-origin always;
